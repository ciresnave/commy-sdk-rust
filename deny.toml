# cargo-deny configuration. An advisory acknowledgement is the PM's call at gate.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # chrono unmaintained (no known vulnerability, no fix): a direct public-API dependency. Dated ignore, expires 2026-12-17
    # (CireSnave standing OK 2026-11-18, via PM): remove when the scheduled Breaking row drop-chrono lands, or renew with a reason.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (no known vulnerability) and is a direct public-API dependency; removal is the scheduled Breaking row drop-chrono; expires 2026-12-17" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",             # option-ext (file-level copyleft, used unmodified as a dependency)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
