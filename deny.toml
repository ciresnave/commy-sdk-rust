# cargo-deny configuration. An advisory acknowledgement is the PM's call at gate.
[graph]
all-features = true

[advisories]
version = 2
# Temporary, PM-approved: RUSTSEC-2025-0134 rustls-pemfile (unmaintained) comes in through
# tokio-tungstenite 0.23 -> rustls-native-certs 0.7. Remove when tokio-tungstenite is upgraded.
ignore = ["RUSTSEC-2025-0134"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",             # option-ext (file-level copyleft, used unmodified as a dependency)
    "CDLA-Permissive-2.0", # webpki-roots (CA certificate data)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
