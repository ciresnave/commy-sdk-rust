# cargo-deny configuration. An advisory acknowledgement is the PM's call at gate.
[graph]
all-features = true

[advisories]
version = 2
# Dispositions for the PM to confirm at gate. All four come in through dependencies we do not control:
#  - RUSTSEC-2024-0363 sqlx 0.7.4 (vulnerability): web-server-abstraction 1.0.2 pins sqlx 0.7; the SDK never builds an sqlx query.
#  - RUSTSEC-2024-0436 paste (unmaintained): via sqlx-core 0.7.4.
#  - RUSTSEC-2025-0134 rustls-pemfile (unmaintained): via tokio-tungstenite 0.23 -> rustls-native-certs 0.7.
#  - RUSTSEC-2024-0449 unsafe-libyaml (unmaintained): via serde_yaml 0.9 <- auth-framework.
ignore = [
    "RUSTSEC-2024-0363",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",             # option-ext (file-level copyleft, used unmodified as a dependency)
    "CDLA-Permissive-2.0", # webpki-roots (CA certificate data)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
