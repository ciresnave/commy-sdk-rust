# This crate is a published library: its API has no consumer inside this repository, so `reachability` reports it.
# Each entry below is an item that was kept on purpose (decision and evidence: ROADMAP.md row cr-reachability).

[reachability]
public_api = [
  { file = "src/auth.rs", symbol = "has_permission", reason = "Public method of AuthContext, reachable by consumers through Session::auth_context()." },
  { file = "src/auth.rs", symbol = "is_admin", reason = "Public method of AuthContext, reachable by consumers through Session::auth_context()." },
  { file = "src/examples_support.rs", symbol = "with_port", reason = "Builder method of ServerConfig, the config of the public demo-server helper." },
  { file = "src/lib.rs", symbol = "VERSION", reason = "Public constant naming the crate version for consumers." },
  { file = "src/message.rs", symbol = "into_inner", reason = "Secret::into_inner, the one sanctioned way to read a secret's value." },
  { file = "src/virtual_file.rs", symbol = "with_persistent", reason = "Builder method for the public `persistent` field of VariableMetadata." },
]
